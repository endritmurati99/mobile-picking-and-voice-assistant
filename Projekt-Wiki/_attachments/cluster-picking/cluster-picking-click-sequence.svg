<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Cluster-Picking Klick-Ablauf</title>
  <desc id="desc">Sequenz vom Klick auf Cluster-Picking bis zum Batch-Abschluss.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .head { fill: #111827; rx: 10; }
      .headtext { font: 700 16px Arial, sans-serif; fill: white; }
      .line { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; }
      .msg { stroke: #1f2937; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .return { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .label { font: 14px Arial, sans-serif; fill: #0f172a; }
      .note { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; rx: 10; }
      .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .fail { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 10; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="820"/>
  <text class="title" x="50" y="52">Was passiert bei einem Klick im Cluster-Picking?</text>
  <text class="small" x="50" y="82">Die PWA startet den Flow, aber jede kritische Entscheidung wird im Backend erneut gegen Odoo geprueft.</text>

  <rect class="head" x="80" y="120" width="150" height="42"/>
  <text class="headtext" x="118" y="147">Picker/PWA</text>
  <rect class="head" x="350" y="120" width="150" height="42"/>
  <text class="headtext" x="400" y="147">FastAPI</text>
  <rect class="head" x="620" y="120" width="150" height="42"/>
  <text class="headtext" x="678" y="147">Odoo</text>
  <rect class="head" x="890" y="120" width="150" height="42"/>
  <text class="headtext" x="952" y="147">n8n</text>

  <line class="line" x1="155" y1="162" x2="155" y2="760"/>
  <line class="line" x1="425" y1="162" x2="425" y2="760"/>
  <line class="line" x1="695" y1="162" x2="695" y2="760"/>
  <line class="line" x1="965" y1="162" x2="965" y2="760"/>

  <path class="msg" d="M155 210 H425"/>
  <text class="label" x="180" y="198">Klick: Cluster-Picking</text>
  <path class="msg" d="M425 240 H695"/>
  <text class="label" x="450" y="228">GET /api/cluster/suggestions</text>
  <path class="return" d="M695 270 H425"/>
  <text class="label" x="470" y="292">offene assigned Pickings + Move-Lines</text>
  <path class="return" d="M425 322 H155"/>
  <text class="label" x="180" y="344">Vorschlaege: Zone, Lieferdatum, Score, Gruende</text>

  <path class="msg" d="M155 395 H425"/>
  <text class="label" x="180" y="383">Klick: Batch starten</text>
  <path class="msg" d="M425 425 H695"/>
  <text class="label" x="450" y="413">Regeln pruefen + stock.picking.batch create</text>
  <path class="msg" d="M425 455 H695"/>
  <text class="label" x="450" y="443">Packages je Auftrag + result_package_id</text>
  <path class="return" d="M695 485 H425"/>
  <text class="label" x="500" y="507">Batch + Boxen + Linien</text>
  <path class="return" d="M425 535 H155"/>
  <text class="label" x="180" y="557">Rundgang anzeigen</text>

  <path class="msg" d="M155 600 H425"/>
  <text class="label" x="180" y="588">Klick: Position bestaetigen</text>
  <path class="msg" d="M425 630 H695"/>
  <text class="label" x="450" y="618">Owner + Karton + Barcode + Serial pruefen</text>
  <path class="return" d="M695 660 H425"/>
  <text class="label" x="500" y="682">picked=True / Progress</text>

  <path class="msg" d="M155 720 H425"/>
  <text class="label" x="180" y="708">Klick: Batch abschliessen</text>
  <path class="msg" d="M425 748 H695"/>
  <text class="label" x="450" y="736">stock.picking.batch.action_done</text>
  <path class="msg" d="M425 776 H965"/>
  <text class="label" x="620" y="798">batch-confirmed Event</text>

  <rect class="note" x="818" y="230" width="330" height="88"/>
  <text class="label" x="840" y="260">Wenn eine Regel fehlschlaegt:</text>
  <text class="small" x="840" y="284">Backend gibt 403/409/422/503 zurueck.</text>
  <text class="small" x="840" y="304">Odoo wird dann nicht beschrieben.</text>

  <rect class="fail" x="818" y="420" width="330" height="86"/>
  <text class="label" x="840" y="450">Falscher oder fehlender Karton:</text>
  <text class="small" x="840" y="474">keine Move-Line wird bestaetigt.</text>
  <text class="small" x="840" y="494">Put-to-Box bleibt fail-closed.</text>

  <rect class="ok" x="818" y="590" width="330" height="86"/>
  <text class="label" x="840" y="620">Nach action_done:</text>
  <text class="small" x="840" y="644">Odoo ist System of Record.</text>
  <text class="small" x="840" y="664">n8n ist Folgeprozess, nicht Voraussetzung.</text>
</svg>
