<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Cluster-Picking Container- und Datenfluss</title>
  <desc id="desc">Zeigt Browser, Caddy, PWA, FastAPI Backend, Odoo, PostgreSQL und n8n im Cluster-Picking Ablauf.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .box { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; rx: 12; }
      .box2 { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 12; }
      .box3 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 12; }
      .box4 { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 12; }
      .db { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .tiny { font: 12px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="52">Cluster-Picking: beteiligte Container und Datenfluss</text>
  <text class="small" x="48" y="82">Die PWA ist nur Bedienoberflaeche. Fachregeln und Odoo-Schreiboperationen liegen im FastAPI-Backend.</text>

  <rect class="lane" x="40" y="116" width="1200" height="540"/>

  <rect class="box" x="76" y="170" width="180" height="95"/>
  <text class="label" x="104" y="205">Browser</text>
  <text class="small" x="104" y="230">Picker bedient PWA</text>
  <text class="tiny" x="104" y="250">Touch / Scan / Voice</text>

  <rect class="box2" x="318" y="170" width="180" height="95"/>
  <text class="label" x="358" y="205">caddy</text>
  <text class="small" x="350" y="230">Reverse Proxy</text>
  <text class="tiny" x="350" y="250">/api -> backend</text>

  <rect class="box" x="560" y="170" width="180" height="95"/>
  <text class="label" x="608" y="205">pwa</text>
  <text class="small" x="594" y="230">Static Server</text>
  <text class="tiny" x="594" y="250">HTML/CSS/JS</text>

  <rect class="box3" x="560" y="344" width="210" height="120"/>
  <text class="label" x="600" y="380">backend</text>
  <text class="small" x="590" y="405">FastAPI / ClusterService</text>
  <text class="tiny" x="590" y="428">Regeln, Owner, Packages</text>
  <text class="tiny" x="590" y="448">/api/cluster/*</text>

  <rect class="box4" x="852" y="344" width="190" height="120"/>
  <text class="label" x="904" y="380">odoo</text>
  <text class="small" x="886" y="405">stock.picking.batch</text>
  <text class="tiny" x="886" y="428">Pickings, Move-Lines</text>
  <text class="tiny" x="886" y="448">Packages, action_done</text>

  <ellipse class="db" cx="1138" cy="404" rx="78" ry="52"/>
  <text class="label" x="1102" y="398">db</text>
  <text class="tiny" x="1090" y="422">PostgreSQL</text>

  <rect class="box2" x="852" y="520" width="190" height="85"/>
  <text class="label" x="914" y="552">n8n</text>
  <text class="small" x="884" y="577">batch-confirmed Event</text>

  <path class="arrow" d="M256 218 H318"/>
  <path class="arrow" d="M498 196 H560"/>
  <text class="tiny" x="512" y="184">PWA laden</text>

  <path class="arrow" d="M408 265 V404 H560"/>
  <text class="tiny" x="420" y="390">/api/*</text>

  <path class="arrow" d="M770 404 H852"/>
  <text class="tiny" x="784" y="390">JSON-RPC</text>

  <path class="arrow" d="M1042 404 H1060"/>
  <path class="dash" d="M947 464 V520"/>
  <text class="tiny" x="960" y="500">nach Abschluss</text>

  <path class="dash" d="M1042 562 C1108 562 1138 498 1138 456"/>
  <text class="tiny" x="1080" y="544">n8n nutzt db</text>

  <rect x="76" y="610" width="1120" height="1" fill="#cbd5e1"/>
  <text class="small" x="80" y="638">Hot Path beim Klick: Browser -> caddy -> backend -> odoo -> db. n8n kommt erst beim Batch-Abschluss als Folgeprozess dazu.</text>
</svg>
