[options]
db_host = db
db_port = 5432
db_user = odoo
; db_password wird vom Docker-Entrypoint via PASSWORD env-Variable gesetzt

addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Master-Passwort bewusst nicht im Repo setzen. Fuer DB-Manager-Aufgaben
; lokal eine nicht versionierte Config mounten; list_db bleibt aus.
;
; ISOLATION — alle drei Schluessel sind noetig, keiner ist redundant:
;   db_name   bindet den Cron-Master an genau diese Datenbank. Das ist der
;             EINZIGE Schluessel, den Odoos Cron-Master beachtet: dbfilter
;             wirkt nur im HTTP-Layer (odoo.http.db_list), waehrend der
;             Cron-Master ueber odoo.service.db.list_dbs(force=True) JEDE
;             Datenbank des Clusters aufzaehlt. Ohne db_name wuerde dieser
;             v19-Dienst die Odoo-18-Datenbank `masterfischer` anfassen —
;             genau das Artefakt, auf dem die Rollback-Strategie beruht.
;             Am laufenden v18-Stack beobachtet und protokolliert (Plan
;             §0.0.4): der v18-Cron-Master zaehlt trotz dbfilter alle
;             Datenbanken auf.
;   dbfilter  schliesst den HTTP-Layer.
;   list_db   verbirgt den Datenbank-Manager.
db_name = lager1
dbfilter = ^lager1$
list_db = False
proxy_mode = True

workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200

log_level = info
log_handler = :INFO
