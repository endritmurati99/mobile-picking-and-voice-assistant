[options]
db_host = db
db_port = 5432
db_user = odoo
; db_password wird vom Docker-Entrypoint via PASSWORD env-Variable gesetzt

addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Master-Passwort bewusst nicht im Repo setzen. Fuer DB-Manager-Aufgaben
; lokal eine nicht versionierte Config mounten; list_db bleibt aus.
;
; ISOLATION — siehe odoo19.conf. db_name ist auch hier der einzige
; Schluessel, den der Cron-Master beachtet; ohne ihn wuerde dieser
; v19-Dienst die Odoo-18-Datenbank `lager2` anfassen. `lager2` ist
; ebenso vom v18-Cron-Master aufzaehlbar und heute nur durch Odoos
; eigene base-Versionspruefung geschuetzt — nicht durch dbfilter.
db_name = lager2
dbfilter = ^lager2$
list_db = False
proxy_mode = True

workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200

log_level = info
log_handler = :INFO
