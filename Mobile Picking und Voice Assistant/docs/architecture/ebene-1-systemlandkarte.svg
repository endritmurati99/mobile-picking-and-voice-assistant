<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Ebene 1: Systemlandkarte des Mobile Picking Assistant</title>
  <desc id="desc">Die PWA läuft im Browser außerhalb von Docker. Caddy ist der einzige öffentliche Eingang und leitet Webseitenaufrufe an den PWA-Dateiserver sowie API-Aufrufe an FastAPI. FastAPI spricht mit Odoo, n8n, Whisper, Piper, Ollama und DINOv2. Der Quality-Weg besteht aus Odoo-Outbox, FastAPI-Dispatcher und signiertem Callback. Odoo und n8n speichern getrennte Daten im selben PostgreSQL-Dienst.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 18px Arial, sans-serif; fill: #475569; }
      .section { font: 700 20px Arial, sans-serif; fill: #334155; letter-spacing: .5px; }
      .box-title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .box-copy { font: 16px Arial, sans-serif; fill: #334155; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .arrow-label { font: 700 14px Arial, sans-serif; fill: #334155; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .flow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .both { fill: none; stroke: #334155; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .async { fill: none; stroke: #ea580c; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .note { font: 700 13px Arial, sans-serif; fill: #475569; }
      .quality-label { font: 700 12px Arial, sans-serif; fill: #c2410c; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">Ebene 1: Wer spricht mit wem?</text>
  <text x="800" y="78" text-anchor="middle" class="subtitle">Die große Systemlandkarte – ohne technische Abkürzungs-Lawine</text>

  <text x="48" y="118" class="section">AUSSERHALB VON DOCKER</text>

  <g aria-label="Kommissionierer">
    <circle cx="82" cy="205" r="30" fill="#fef3c7" stroke="#a16207" stroke-width="3"/>
    <path d="M 38 300 Q 82 242 126 300" fill="#fef3c7" stroke="#a16207" stroke-width="3"/>
    <text x="82" y="337" text-anchor="middle" class="box-title">Mensch</text>
    <text x="82" y="363" text-anchor="middle" class="small">Scanner · Kamera</text>
    <text x="82" y="383" text-anchor="middle" class="small">Mikrofon · Touch</text>
  </g>

  <g aria-label="PWA im Browser">
    <rect x="178" y="144" width="310" height="220" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <rect x="203" y="177" width="260" height="125" rx="9" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="222" cy="163" r="5" fill="#ef4444"/>
    <circle cx="239" cy="163" r="5" fill="#f59e0b"/>
    <circle cx="256" cy="163" r="5" fill="#22c55e"/>
    <text x="333" y="220" text-anchor="middle" class="box-title">PWA im Browser</text>
    <text x="333" y="250" text-anchor="middle" class="box-copy">Bildschirm und Bedienung</text>
    <text x="333" y="274" text-anchor="middle" class="box-copy">läuft auf Handy oder PC</text>
    <text x="333" y="329" text-anchor="middle" class="small">fachlich nur mit FastAPI · technisch via Caddy</text>
  </g>

  <path d="M 128 250 L 176 250" class="both"/>
  <text x="151" y="237" text-anchor="middle" class="arrow-label">bedient</text>

  <rect x="535" y="104" width="1015" height="780" rx="26" fill="#f8fafc" stroke="#475569" stroke-width="4" stroke-dasharray="15 10"/>
  <text x="565" y="138" class="section">IN DOCKER: DIE SERVERDIENSTE</text>

  <g aria-label="Caddy">
    <rect x="590" y="152" width="210" height="160" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="695" y="191" text-anchor="middle" class="box-title">Caddy</text>
    <text x="695" y="220" text-anchor="middle" class="box-copy">einziger öffentlicher Eingang</text>
    <text x="695" y="248" text-anchor="middle" class="small">verteilt Web und /api/*</text>
    <text x="695" y="273" text-anchor="middle" class="small">blockiert interne Routen</text>
  </g>

  <g aria-label="PWA-Dateiserver">
    <rect x="590" y="390" width="210" height="124" rx="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
    <text x="695" y="432" text-anchor="middle" class="box-title">PWA-Dateien</text>
    <text x="695" y="460" text-anchor="middle" class="box-copy">HTML · CSS · JavaScript</text>
    <text x="695" y="486" text-anchor="middle" class="small">werden an den Browser geliefert</text>
  </g>

  <g aria-label="FastAPI Backend">
    <rect x="885" y="160" width="270" height="190" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="1020" y="207" text-anchor="middle" class="box-title">FastAPI</text>
    <text x="1020" y="238" text-anchor="middle" class="box-copy">Application Gateway</text>
    <text x="1020" y="271" text-anchor="middle" class="small">Sicherheit · Orchestrierung</text>
    <text x="1020" y="294" text-anchor="middle" class="small">Dispatcher für Odoo-Outbox</text>
    <text x="1020" y="317" text-anchor="middle" class="small">koordiniert interne Dienste</text>
  </g>

  <g aria-label="Odoo">
    <rect x="1220" y="125" width="280" height="175" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="1360" y="166" text-anchor="middle" class="box-title">Odoo 19</text>
    <text x="1360" y="196" text-anchor="middle" class="box-copy">ERP · System of Record</text>
    <text x="1360" y="225" text-anchor="middle" class="small">Aufträge · Bestand · Benutzer</text>
    <text x="1360" y="249" text-anchor="middle" class="small">Quality Alerts · Outbox</text>
    <text x="1360" y="273" text-anchor="middle" class="small">ERP-Geschäftslogik · Cluster-Batches</text>
  </g>

  <g aria-label="n8n">
    <rect x="1240" y="380" width="240" height="142" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="1360" y="426" text-anchor="middle" class="box-title">n8n</text>
    <text x="1360" y="457" text-anchor="middle" class="box-copy">Workflow-Motor</text>
    <text x="1360" y="485" text-anchor="middle" class="small">vor allem Quality-Verarbeitung</text>
  </g>

  <g aria-label="Whisper">
    <rect x="815" y="567" width="190" height="122" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
    <text x="910" y="611" text-anchor="middle" class="box-title">Whisper</text>
    <text x="910" y="642" text-anchor="middle" class="box-copy">Sprache → Text</text>
    <text x="910" y="667" text-anchor="middle" class="small">hört zu</text>
  </g>

  <g aria-label="Embedding DINOv2">
    <rect x="570" y="567" width="220" height="150" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
    <text x="680" y="603" text-anchor="middle" class="box-title" font-size="18">Embedding / DINOv2</text>
    <text x="680" y="632" text-anchor="middle" class="small">Quality: Artikelbild-Vergleich</text>
    <text x="680" y="657" text-anchor="middle" class="small">Bild → Merkmalsvektor</text>
    <text x="680" y="682" text-anchor="middle" class="small">Form + Farbe · keine Buchung</text>
    <text x="680" y="704" text-anchor="middle" class="note" font-size="11">kein Barcode- oder Schadensscanner</text>
  </g>

  <g aria-label="Piper">
    <rect x="1030" y="567" width="190" height="122" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
    <text x="1125" y="611" text-anchor="middle" class="box-title">Piper</text>
    <text x="1125" y="642" text-anchor="middle" class="box-copy">Text → Sprache</text>
    <text x="1125" y="667" text-anchor="middle" class="small">spricht vor</text>
  </g>

  <g aria-label="Ollama">
    <rect x="1245" y="567" width="235" height="122" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
    <text x="1362" y="611" text-anchor="middle" class="box-title">Ollama</text>
    <text x="1362" y="642" text-anchor="middle" class="box-copy">lokale KI</text>
    <text x="1362" y="667" text-anchor="middle" class="small">Text und Bilder bewerten</text>
  </g>

  <g aria-label="PostgreSQL">
    <rect x="970" y="752" width="430" height="105" rx="18" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <text x="1185" y="787" text-anchor="middle" class="box-title">PostgreSQL</text>
    <line x1="1185" y1="801" x2="1185" y2="843" stroke="#94a3b8" stroke-width="2"/>
    <text x="1078" y="827" text-anchor="middle" class="box-copy">Odoo-Datenbanken</text>
    <text x="1292" y="827" text-anchor="middle" class="box-copy">n8n-Datenbank</text>
  </g>

  <g aria-label="Optionales Odoo-Profil">
    <rect x="565" y="765" width="350" height="72" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="740" y="794" text-anchor="middle" class="note">Profil: zweite Odoo-Instanz optional</text>
    <text x="740" y="818" text-anchor="middle" class="small">eigenes System of Record im selben Core-Netz</text>
  </g>

  <path d="M 488 215 L 588 215" class="flow"/>
  <text x="538" y="202" text-anchor="middle" class="arrow-label">HTTPS</text>
  <path d="M 590 285 L 488 285" class="flow"/>
  <text x="539" y="307" text-anchor="middle" class="arrow-label">Web-Dateien</text>
  <path d="M 695 314 L 695 388" class="both"/>
  <text x="710" y="356" class="arrow-label">Webseite</text>
  <path d="M 801 215 L 883 215" class="both"/>
  <text x="842" y="201" text-anchor="middle" class="arrow-label">/api/*</text>
  <path d="M 1157 218 L 1218 218" class="both"/>
  <text x="1188" y="202" text-anchor="middle" class="arrow-label">JSON-RPC</text>
  <path d="M 1218 282 L 1185 282 L 1185 310 L 1157 310" class="async"/>
  <path d="M 1157 294 L 1192 294 L 1192 410 L 1238 410" class="async"/>
  <text x="1206" y="352" text-anchor="middle" class="quality-label">Outbox-</text>
  <text x="1206" y="367" text-anchor="middle" class="quality-label">Zustellung</text>
  <path d="M 1238 480 L 1172 480 L 1172 326 L 1157 326" class="async"/>
  <text x="1184" y="441" text-anchor="middle" class="quality-label">signierter</text>
  <text x="1184" y="456" text-anchor="middle" class="quality-label">Callback</text>
  <path d="M 1005 352 L 1005 520 L 910 520 L 910 565" class="both"/>
  <path d="M 1034 352 L 1034 530 L 1125 530 L 1125 565" class="both"/>
  <path d="M 1062 352 L 1062 515 L 1362 515 L 1362 565" class="both"/>
  <path d="M 976 352 L 976 540 L 680 540 L 680 565" class="both"/>
  <text x="755" y="531" text-anchor="middle" class="arrow-label">Quality: Artikelbild-Ähnlichkeit</text>
  <text x="913" y="507" text-anchor="middle" class="arrow-label">Audio</text>
  <text x="1125" y="517" text-anchor="middle" class="arrow-label">Audio</text>
  <text x="1362" y="552" text-anchor="middle" class="arrow-label">Text / Bild</text>
  <path d="M 1502 213 L 1525 213 L 1525 724 L 1370 724 L 1370 750" class="both"/>
  <path d="M 1482 451 L 1505 451 L 1505 707 L 1305 707 L 1305 750" class="both"/>

  <g aria-label="Legende">
    <text x="50" y="935" class="section">SO LIEST DU DIE PFEILE</text>
    <line x1="50" y1="970" x2="140" y2="970" class="both"/>
    <text x="160" y="976" class="box-copy">direkter Aufruf und direkte Antwort</text>
    <line x1="510" y1="970" x2="600" y2="970" class="async"/>
    <text x="620" y="976" class="box-copy">gerichtete, asynchrone Quality-Nachricht</text>
  </g>

  <rect x="50" y="1012" width="1500" height="58" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="800" y="1048" text-anchor="middle" class="box-title">Merksatz: Die PWA spricht mit FastAPI. FastAPI spricht mit den internen Diensten.</text>
</svg>
