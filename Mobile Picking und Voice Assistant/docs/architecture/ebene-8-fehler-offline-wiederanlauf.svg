<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Ebene 8: Fehler, Offline und Wiederanlauf</title>
  <desc id="desc">Drei Recovery-Linien für PWA-Verbindungsverlust, synchrone Picking-Schreibvorgänge und asynchrone Quality-Zustellung.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:34px;font-weight:700}.s{font-size:17px;fill:#526173}.lane{font-size:22px;font-weight:700}.t{font-size:19px;font-weight:700}.b{font-size:15px}.x{font-size:13px;fill:#526173}.flow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.center{text-anchor:middle}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#ffffff"/>
  <text x="70" y="65" class="h">Ebene 8 · Fehler, Offline und Wiederanlauf</text>
  <text x="70" y="98" class="s">Die App zeigt Fehler offen, lädt Odoos Wahrheit neu und wiederholt nur dort automatisch, wo es dauerhaft abgesichert ist</text>
  <rect x="1510" y="35" width="220" height="70" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="1620" y="64" class="t center">100/100</text><text x="1620" y="88" class="x center">Architekturdarstellung</text>

  <rect x="55" y="135" width="1690" height="245" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="85" y="175" class="lane">A · Browser und PWA</text>
  <rect x="90" y="210" width="265" height="125" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="244" class="t">Online</text><text x="110" y="274" class="b">API liefert Odoo-Zustand</text><text x="110" y="302" class="x">Service Worker: network first</text>
  <path class="flow" d="M365 272 H435"/>
  <rect x="450" y="210" width="285" height="125" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="470" y="244" class="t">Verbindung fällt aus</text><text x="470" y="274" class="b">Requestfehler statt Erfolg</text><text x="470" y="302" class="x">keine lokale Write-Queue</text>
  <path class="flow" d="M745 272 H815"/>
  <rect x="830" y="210" width="300" height="125" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="850" y="244" class="t">App-Shell bleibt</text><text x="850" y="274" class="b">HTML · CSS · JavaScript</text><text x="850" y="302" class="x">keine Aufträge / API-Daten</text>
  <path class="flow" d="M1140 272 H1210"/>
  <rect x="1225" y="195" width="455" height="155" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="1245" y="231" class="t">Online / Resume</text><text x="1245" y="261" class="b">Service Worker prüfen → Claim heartbeat</text><text x="1245" y="289" class="b">Auftragsdetail aus Odoo neu laden</text><text x="1245" y="317" class="x">Claim weg → 409-Konfliktansicht</text>

  <rect x="55" y="405" width="1690" height="275" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="445" class="lane">B · Sitzung, Claim und synchroner Schreibvorgang</text>
  <rect x="90" y="485" width="245" height="135" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="520" class="t">Aktion + Key</text><text x="110" y="550" class="b">Claim vor dem Write</text><text x="110" y="578" class="x">Heartbeat 30 s · TTL 120 s</text>
  <path class="flow" d="M345 552 H405"/>
  <rect x="420" y="485" width="280" height="135" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="440" y="520" class="t">Odoo reserviert</text><text x="440" y="550" class="b">Principal + Key + Fingerprint</text><text x="440" y="578" class="x">24 Stunden gespeichert</text>
  <path class="flow" d="M710 552 H770"/>
  <rect x="785" y="470" width="290" height="165" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="805" y="505" class="t">Erster Lauf</text><text x="805" y="535" class="b">Odoo prüft und schreibt</text><text x="805" y="563" class="b">Antwort dauerhaft merken</text><text x="805" y="591" class="x">Fehler: Reservation abbrechen</text>
  <path class="flow" d="M1085 552 H1145"/>
  <rect x="1160" y="455" width="520" height="195" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1180" y="490" class="t">Wiederholung / Konflikt</text><text x="1180" y="520" class="b">Antwort verloren → gleicher Key spielt Ergebnis wieder</text><text x="1180" y="550" class="b">noch aktiv / andere Daten → 409</text><text x="1180" y="580" class="b">anderer Claim-Besitzer → Sperransicht</text><text x="1180" y="610" class="x">401 → zentral zurück zum Login</text>

  <rect x="55" y="705" width="1690" height="305" rx="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="85" y="745" class="lane">C · Quality-Outbox und asynchroner Wiederanlauf</text>
  <rect x="90" y="785" width="245" height="145" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="110" y="820" class="t">Odoo-Transaktion</text><text x="110" y="850" class="b">Alert + Fotos + Job</text><text x="110" y="878" class="b">+ Outbox dauerhaft</text><text x="110" y="906" class="x">Meldung überlebt Ausfall</text>
  <path class="flow" d="M345 858 H405"/>
  <rect x="420" y="785" width="255" height="145" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="820" class="t">Dispatcher-Lease</text><text x="440" y="850" class="b">Poll 2 s · Lease 60 s</text><text x="440" y="878" class="b">ein signierter Versuch</text><text x="440" y="906" class="x">bis zu 50 je Instanz</text>
  <path class="flow" d="M685 858 H745"/>
  <rect x="760" y="770" width="275" height="175" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="780" y="805" class="t">Annahme?</text><text x="780" y="835" class="b">ja → Ack + delivered</text><text x="780" y="863" class="b">nein → Odoo-Backoff</text><text x="780" y="891" class="x">10 s · 1 m · 5 m · 30 m</text><text x="780" y="919" class="x">2 h · danach 6 h</text>
  <path class="flow" d="M1045 835 H1105"/>
  <rect x="1120" y="760" width="270" height="185" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1140" y="795" class="t">Zehn Fehler</text><text x="1140" y="825" class="b">Outbox → dead</text><text x="1140" y="853" class="b">Supervisor behebt Ursache</text><text x="1140" y="881" class="b">und requeued manuell</text><text x="1140" y="915" class="x">keine PWA-Schaltfläche</text>
  <path class="flow" d="M1045 900 V972 H1450 V900 H1460"/><text x="1110" y="964" class="x">angenommen, aber terminaler Callback bleibt aus</text>
  <rect x="1475" y="760" width="220" height="185" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="1495" y="795" class="t">Callback fehlt</text><text x="1495" y="825" class="b">Lease läuft ab</text><text x="1495" y="853" class="b">Watchdog: +Generation</text><text x="1495" y="881" class="b">zurück auf pending</text><text x="1495" y="915" class="x">Prüfung jede Minute</text>

  <rect x="55" y="1040" width="800" height="105" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="80" y="1075" class="t">Sicherer Grundsatz</text><text x="80" y="1105" class="b">Kein Backend → kein erfundener Erfolg · Odoo bleibt Fachwahrheit · Wiederholungen tragen Identität</text><text x="80" y="1131" class="x">Whisper/Ollama/Piper fallen auf Nichtstun, Regeln, Touch/Scanner oder Browser-TTS zurück.</text>
  <rect x="895" y="1040" width="850" height="105" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="920" y="1075" class="t">Ehrliche Grenze</text><text x="920" y="1105" class="b">App-Shell offline ≠ Offline-Picking · Online-Anzeige ≠ Backend-Readiness · keine dauerhaften Formulardrafts</text><text x="920" y="1131" class="x">Dead Letter braucht Supervisor; Browser-Writes werden nicht automatisch gequeued oder wiederholt.</text>
  <text x="900" y="1180" class="b center"><tspan font-weight="700">Querschnitt:</tspan> Ebene 8 ergänzt die Fachabläufe 2–5 und 7; Ebene 6 stellt ihre technische Basis dar.</text>
</svg>
