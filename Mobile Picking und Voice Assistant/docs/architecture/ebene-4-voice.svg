<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Ebene 4: Voice</title><desc id="desc">Sichere Sprachbedienung mit Whisper, Intent-Erkennung, normalem Odoo-Buchungspfad und Piper.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:34px;font-weight:700}.s{font-size:17px;fill:#526173}.t{font-size:21px;font-weight:700}.b{font-size:16px}.x{font-size:14px;fill:#526173}.f{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="980" fill="#fff"/><text x="70" y="65" class="h">Ebene 4 · Voice mit Whisper und Piper</text><text x="70" y="98" class="s">Sprache ergänzt Touch und Scanner – sie erhält keinen Sonderweg zu Odoo</text>
  <g transform="translate(70 145)">
    <rect width="250" height="150" rx="18" fill="#e8f1ff" stroke="#3b82f6" stroke-width="2"/><text x="22" y="40" class="t">1 Sprechen</text><text x="22" y="75" class="b">Push-to-Talk oder</text><text x="22" y="103" class="b">Hands-free</text><text x="22" y="130" class="x">maximal 10 Sekunden</text><path class="f" d="M260 75 H305"/>
    <g transform="translate(320)"><rect width="250" height="150" rx="18" fill="#f1eafe" stroke="#8b5cf6" stroke-width="2"/><text x="22" y="40" class="t">2 Whisper</text><text x="22" y="75" class="b">Audio → deutscher Text</text><text x="22" y="105" class="b">Stille verwerfen</text></g><path class="f" d="M580 75 H625"/>
    <g transform="translate(640)"><rect width="250" height="150" rx="18" fill="#e8f7ee" stroke="#22c55e" stroke-width="2"/><text x="22" y="40" class="t">3 Intent prüfen</text><text x="22" y="75" class="b">Regeln zuerst</text><text x="22" y="103" class="b">Kontext + Verneinung</text><text x="22" y="130" class="x">Ollama nur optional</text></g><path class="f" d="M900 75 H945"/>
    <g transform="translate(960)"><rect width="250" height="150" rx="18" fill="#fff4df" stroke="#f59e0b" stroke-width="2"/><text x="22" y="40" class="t">4 Sicher handeln</text><text x="22" y="75" class="b">Rückfrage bei Risiko</text><text x="22" y="103" class="b">normaler confirm-line</text><text x="22" y="130" class="x">Claim + Idempotenz</text></g><path class="f" d="M1220 75 H1265"/>
    <g transform="translate(1280)"><rect width="250" height="150" rx="18" fill="#feecec" stroke="#ef4444" stroke-width="2"/><text x="22" y="40" class="t">5 Odoo</text><text x="22" y="75" class="b">prüft und speichert</text><text x="22" y="103" class="b">oder lehnt ab</text></g>
  </g>
  <rect x="70" y="355" width="1460" height="330" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="100" y="400" class="t">Antwort zurück zum Mitarbeiter</text>
  <rect x="120" y="455" width="340" height="150" rx="18" fill="#e8f7ee" stroke="#22c55e" stroke-width="2"/><text x="145" y="495" class="t">FastAPI-Antwort</text><text x="145" y="530" class="b">Erfolg, Rückfrage, Status</text><text x="145" y="560" class="b">oder lesende Bestandsantwort</text>
  <path class="f" d="M475 530 H650"/><text x="515" y="510" class="x">Text</text>
  <rect x="665" y="455" width="300" height="150" rx="18" fill="#f1eafe" stroke="#8b5cf6" stroke-width="2"/><text x="690" y="495" class="t">Piper</text><text x="690" y="530" class="b">längere Texte → WAV</text><text x="690" y="560" class="x">de_DE-thorsten-medium</text>
  <path class="f" d="M980 530 H1155"/>
  <rect x="1170" y="455" width="300" height="150" rx="18" fill="#e8f1ff" stroke="#3b82f6" stroke-width="2"/><text x="1195" y="495" class="t">PWA spricht</text><text x="1195" y="530" class="b">Piper oder Browser-TTS</text><text x="1195" y="560" class="x">Mikrofon dabei stumm</text>
  <rect x="70" y="735" width="700" height="150" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="100" y="775" class="t">Sicherheitslinie</text><text x="100" y="810" class="b">confirm_all immer bestätigen · unsicheres confirm rückfragen</text><text x="100" y="842" class="b">LLM-Schreibintent darf nie allein buchen</text>
  <rect x="830" y="735" width="700" height="150" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="860" y="775" class="t">Fallback-Linie</text><text x="860" y="810" class="b">Voice-Ausfall lässt Touch, Scanner und Kamera unverändert</text><text x="860" y="842" class="b">Assist ist aktuell lesend und ruft weder n8n noch LLM auf</text>
</svg>
