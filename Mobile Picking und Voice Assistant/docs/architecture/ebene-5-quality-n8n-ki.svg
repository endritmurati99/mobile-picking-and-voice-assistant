<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Ebene 5: Quality, n8n und lokale KI</title><desc id="desc">Asynchroner Quality-Ablauf von der Meldung über Odoo-Outbox und n8n bis zum signierten Ergebnis.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:34px;font-weight:700}.s{font-size:17px;fill:#526173}.t{font-size:20px;font-weight:700}.b{font-size:15px}.x{font-size:13px;fill:#526173}.f{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke-dasharray:8 6}</style></defs>
  <rect width="1800" height="1050" fill="#fff"/><text x="70" y="65" class="h">Ebene 5 · Quality, n8n sowie Text- und Bild-KI</text><text x="70" y="98" class="s">Die Meldung wird sofort gespeichert; die lokale Bewertung folgt sicher und asynchron</text>
  <g transform="translate(55 145)">
    <rect width="220" height="150" rx="18" fill="#e8f1ff" stroke="#3b82f6" stroke-width="2"/><text x="20" y="38" class="t">1 PWA meldet</text><text x="20" y="72" class="b">Beschreibung + Priorität</text><text x="20" y="100" class="b">optional Fotos</text><text x="20" y="127" class="x">POST /quality-alerts</text><path class="f" d="M230 75 H275"/>
    <g transform="translate(290)"><rect width="250" height="150" rx="18" fill="#feecec" stroke="#ef4444" stroke-width="2"/><text x="20" y="38" class="t">2 Odoo speichert</text><text x="20" y="72" class="b">Alert + Originalfotos</text><text x="20" y="100" class="b">Job + Outbox</text><text x="20" y="127" class="x">eine Transaktion</text></g><path class="f" d="M550 75 H595"/>
    <g transform="translate(610)"><rect width="250" height="150" rx="18" fill="#e8f7ee" stroke="#22c55e" stroke-width="2"/><text x="20" y="38" class="t">3 Dispatcher</text><text x="20" y="72" class="b">Lease + Wiederholung</text><text x="20" y="100" class="b">HMAC-Signatur</text><text x="20" y="127" class="x">at least once</text></g><path class="f" d="M870 75 H915"/>
    <g transform="translate(930)"><rect width="220" height="150" rx="18" fill="#fff4df" stroke="#f59e0b" stroke-width="2"/><text x="20" y="38" class="t">4 n8n prüft</text><text x="20" y="72" class="b">Signatur + Nonce</text><text x="20" y="100" class="b">Event annehmen</text><text x="20" y="127" class="x">Duplikat: process=false</text></g><path class="f" d="M1160 75 H1205"/>
    <g transform="translate(1220)"><rect width="250" height="150" rx="18" fill="#f1eafe" stroke="#8b5cf6" stroke-width="2"/><text x="20" y="38" class="t">5 Ollama lokal</text><text x="20" y="72" class="b">Text: qwen2.5:7b</text><text x="20" y="100" class="b">Bilder: qwen2.5vl:7b</text><text x="20" y="127" class="x">höchstens 3 Fotos</text></g><path class="f" d="M1480 75 H1525"/>
    <g transform="translate(1540)"><rect width="205" height="150" rx="18" fill="#feecec" stroke="#ef4444" stroke-width="2"/><text x="20" y="38" class="t">6 Odoo-Ergebnis</text><text x="20" y="72" class="b">Empfehlung oder</text><text x="20" y="100" class="b">review_required</text><text x="20" y="127" class="x">signierter Callback</text></g>
  </g>
  <rect x="70" y="355" width="1660" height="330" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="100" y="400" class="t">Sicherer v2-Transportvertrag</text>
  <rect x="110" y="445" width="420" height="165" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="135" y="480" class="t">Hinweg</text><text x="135" y="515" class="b">Methode + Pfad + Generation + Zeit</text><text x="135" y="545" class="b">Nonce + SHA-256 des Bodys → HMAC</text><text x="135" y="575" class="x">Ack zählt nur mit passender Event-ID</text>
  <path class="f" d="M545 525 H680"/>
  <rect x="695" y="445" width="410" height="165" rx="16" fill="#fff4df" stroke="#f59e0b" stroke-width="2"/><text x="720" y="480" class="t">Receipt + Lease in Odoo</text><text x="720" y="515" class="b">Event-ID, Fingerprint, Generation</text><text x="720" y="545" class="b">Nonce und 5-Minuten-Lease</text><text x="720" y="575" class="x">Wiederholung sicher erkennbar</text>
  <path class="f" d="M1120 525 H1255"/>
  <rect x="1270" y="445" width="420" height="165" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1295" y="480" class="t">Rückweg</text><text x="1295" y="515" class="b">signierter terminaler Callback</text><text x="1295" y="545" class="b">Callback-ID + Sequenz + Lease prüfen</text><text x="1295" y="575" class="x">Job und Alert gemeinsam aktualisieren</text>
  <rect x="70" y="735" width="800" height="190" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="100" y="775" class="t">Erfolg</text><text x="100" y="812" class="b">sellable · rework · quarantine · scrap</text><text x="100" y="845" class="b">deterministische Empfehlung + Fotoanalyse in Odoo</text><text x="100" y="878" class="x">Die PWA zeigt derzeit nur den laufenden Analysehinweis.</text>
  <rect x="930" y="735" width="800" height="190" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="960" y="775" class="t">Sicherer Fehlerfall</text><text x="960" y="812" class="b">Textmodellfehler oder Widerspruch → review_required</text><text x="960" y="845" class="b">keine Heuristik, kein erfundenes Ersatzurteil</text><text x="960" y="878" class="x">Outbox wiederholt; dead kann aktuell trotzdem pending hinterlassen.</text>
</svg>
