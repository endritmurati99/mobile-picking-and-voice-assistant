services:
  # ── Reverse Proxy ──────────────────────────────────────────
  caddy:
    # Verifiziert: v2.11.2 (>= 2.10, Voraussetzung fuer `request_body max_size`,
    # das Foundation Task 15 setzt — nicht dieser Cutover, siehe Plan §0.2).
    # Digest stammt aus dem LAUFENDEN Image, nicht aus dem aktuellen Registry-Tag:
    # caddy:2-alpine zeigte zum Pin-Zeitpunkt bereits auf einen anderen Digest.
    image: caddy:2-alpine@sha256:fce4f15aad23222c0ac78a1220adf63bae7b94355d5ea28eee53910624acedfa
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    environment:
      LAN_HOST: ${LAN_HOST:-localhost}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./infrastructure/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge-net:
        ipv4_address: 172.28.10.2

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    # Verifiziert: PostgreSQL 16.13. MAJOR NIEMALS anheben — das verlangte ein
    # pg_upgrade von pg_data, wo JEDE Datenbank dieses Stacks liegt.
    image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-n8n-db.sql:/docker-entrypoint-initdb.d/init-n8n-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - core-net
      - automation-net

  # ── Odoo 19 Community (Live/Default) ──────────────────────
  odoo:
    build:
      context: ./odoo
      dockerfile: Dockerfile
      args:
        ODOO_BASE_IMAGE: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/odoo19.conf:/etc/odoo/odoo.conf:ro
      - ./odoo/addons:/mnt/extra-addons:ro
    networks:
      - core-net

  # ── Optionale zweite Odoo-Instanz fuer Lagerumschalter ─────
  odoo-lager-2:
    build:
      context: ./odoo
      dockerfile: Dockerfile
      args:
        ODOO_BASE_IMAGE: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
    profiles:
      - second-odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo_lager2_data:/var/lib/odoo
      - ./odoo/odoo19-lager2.conf:/etc/odoo/odoo.conf:ro
      - ./odoo/addons:/mnt/extra-addons:ro
    networks:
      - core-net

  # ── App-Backend (FastAPI) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - odoo
      - whisper
      - piper
      - ollama
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:?ODOO_DB muss gesetzt sein und eine v19-Datenbank benennen}
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-}
      ODOO_INSTANCES_JSON: ${ODOO_INSTANCES_JSON:-}
      WHISPER_URL: http://whisper:9000
      PIPER_URL: http://piper:5500
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-90000}
      # Ohne dieses Flag laeuft der Outbox-Dispatcher nicht und KEIN Ereignis
      # wird je zugestellt (Default in config.py ist False).
      DISPATCHER_ENABLED: ${DISPATCHER_ENABLED:-true}
      # Signierschluessel der v2-Strecke. Mit aktivem Dispatcher sind sie
      # Pflicht: ohne sie kann das Backend keinen Envelope signieren, und ein
      # stiller Default waere eine Signatur, der die Gegenseite nicht traut.
      # Dieselben Werte liegen als Dateien unter infrastructure/secrets/ und
      # speisen von dort den n8n-Credential-Provisioner.
      PWR_BACKEND_TO_N8N_ACTIVE_KEY_ID: ${PWR_BACKEND_TO_N8N_ACTIVE_KEY_ID:?PWR_BACKEND_TO_N8N_ACTIVE_KEY_ID muss gesetzt sein}
      PWR_BACKEND_TO_N8N_ACTIVE_SECRET_B64: ${PWR_BACKEND_TO_N8N_ACTIVE_SECRET_B64:?PWR_BACKEND_TO_N8N_ACTIVE_SECRET_B64 muss gesetzt sein}
      PWR_N8N_TO_BACKEND_ACTIVE_KEY_ID: ${PWR_N8N_TO_BACKEND_ACTIVE_KEY_ID:?PWR_N8N_TO_BACKEND_ACTIVE_KEY_ID muss gesetzt sein}
      PWR_N8N_TO_BACKEND_ACTIVE_SECRET_B64: ${PWR_N8N_TO_BACKEND_ACTIVE_SECRET_B64:?PWR_N8N_TO_BACKEND_ACTIVE_SECRET_B64 muss gesetzt sein}
      # Voice-Intent-Modell beim Start vorwaermen (haelt die erste Aeusserung
      # aus dem Kaltstart heraus; Ollama KEEP_ALIVE haelt es danach 24h).
      VOICE_LLM_WARMUP: ${VOICE_LLM_WARMUP:-true}
      N8N_WEBHOOK_BASE: http://n8n:5678/webhook
      N8N_WEBHOOK_PATH_QUALITY_ALERT_CREATED: ${N8N_WEBHOOK_PATH_QUALITY_ALERT_CREATED:-quality-alert-created}
      N8N_WEBHOOK_PATH_VOICE_EXCEPTION_QUERY: ${N8N_WEBHOOK_PATH_VOICE_EXCEPTION_QUERY:-voice-exception-query}
      N8N_WEBHOOK_PATH_SHORTAGE_REPORTED: ${N8N_WEBHOOK_PATH_SHORTAGE_REPORTED:-shortage-reported}
      N8N_WEBHOOK_PATH_PICK_CONFIRMED: ${N8N_WEBHOOK_PATH_PICK_CONFIRMED:-pick-confirmed}
      SESSION_THROTTLE_HMAC_SECRET_B64: ${SESSION_THROTTLE_HMAC_SECRET_B64}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      N8N_SYNC_TIMEOUT_MS: ${N8N_SYNC_TIMEOUT_MS:-7000}
      N8N_CALLBACK_SECRET: ${N8N_CALLBACK_SECRET:?N8N_CALLBACK_SECRET muss gesetzt sein}
      N8N_CIRCUIT_BREAKER_FAILURES: ${N8N_CIRCUIT_BREAKER_FAILURES:-3}
      N8N_CIRCUIT_BREAKER_OPEN_SECONDS: ${N8N_CIRCUIT_BREAKER_OPEN_SECONDS:-60}
      OBSIDIAN_PATH: /obsidian
      PWA_ORIGINS: "https://${LAN_HOST:-localhost}"
      # RUNTIME_PROFILE ist ab dem Odoo-19-Cutover FAIL-CLOSED: der Stack
      # startet nicht mehr, wenn die Variable fehlt. Das schliesst das
      # Restloch, das das Register der "deployment work" zugewiesen hatte —
      # naemlich die ABWESENHEIT der Variable, die vorher still auf
      # "development" zurueckfiel und damit validate_runtime_security()
      # komplett uebersprang. Der Wert selbst bleibt eine Entscheidung des
      # Betreibers; app/config.py loggt bei != "production" weiterhin eine
      # WARNING (warn_non_production_runtime_profile), und R1s Entscheidung
      # "warnen statt hart abbrechen" bleibt damit unangetastet.
      RUNTIME_PROFILE: ${RUNTIME_PROFILE:?RUNTIME_PROFILE muss gesetzt sein (production|development)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_TRACEABILITY_ENABLED: ${DEMO_TRACEABILITY_ENABLED:-false}
      DEMO_TRACEABILITY_ALLOWED_DBS: ${DEMO_TRACEABILITY_ALLOWED_DBS:-masterfischer_o19_trial}
      # Der Dispatcher laedt die Ziele zur Laufzeit aus DIESEM Mount. Damit
      # gibt es genau eine Quelle fuer Webhook-Pfade; doppelte
      # N8N_WEBHOOK_PATH_*-Variablen sind der Weg, auf dem Registry und
      # Compose auseinanderlaufen.
      WORKFLOW_REGISTRY_PATH: /run/pwr/workflow-registry.json
    volumes:
      - ./backend/app:/app/app:ro
      - ./docs:/obsidian:ro
      - ./n8n/workflow-registry.json:/run/pwr/workflow-registry.json:ro
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "info", "--reload" ]
    networks:
      edge-net:
        ipv4_address: 172.28.10.3
      core-net:
      automation-net:

  # ── Whisper STT Server (Deutsch, small Modell) ─────────────
  whisper:
    # `:latest` hat keine rekonstruierbare Version — Digest des laufenden Images.
    image: onerahmet/openai-whisper-asr-webservice:latest@sha256:03b402335881cdab2e4939b24620809df8d6ceec3bf2712217d41c8761a0f5d4
    restart: unless-stopped
    environment:
      ASR_MODEL: small
      ASR_ENGINE: faster_whisper
      # Ohne das prueft huggingface_hub beim Start die Revision ONLINE und
      # scheitert auf dem internen Netz, obwohl das Modell im Cache liegt.
      HF_HUB_OFFLINE: "1"
      # CPython importiert `sitecustomize` beim Start automatisch. Der Patch in
      # whisper/sitecustomize.py verkleinert das feste 30-s-Mel-Fenster von
      # faster-whisper auf die tatsaechliche Audiolaenge -- gemessen 1418 -> 257 ms
      # bei gleichem Transkript. Auf "0" setzen deaktiviert ihn ohne Neustart der
      # Compose-Datei-Struktur.
      PYTHONPATH: /patch
      WHISPER_ADAPTIVE_WINDOW: ${WHISPER_ADAPTIVE_WINDOW:-1}
    volumes:
      - ./whisper/sitecustomize.py:/patch/sitecustomize.py:ro
      # automation-net ist `internal`, also OHNE Weg nach draussen. Ohne
      # persistenten Cache laedt faster-whisper sein Modell bei jedem
      # Neuerstellen erneut herunter und bleibt dann in einer Restart-Schleife
      # haengen -- genau so ist dieser Dienst beim Umbau auf die drei Netze
      # ausgefallen. Der Cache wird einmalig mit docker-compose.egress.yml
      # gefuellt.
      - whisper_cache:/root/.cache
    networks:
      - automation-net

  # ── Piper TTS Server (Deutsch, thorsten-high) ───────────────
  piper:
    build:
      context: ./piper
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - automation-net

  # ── Ollama (lokales LLM fuer KI-Qualitaetsbewertung, CPU-only) ─
  # Laeuft offline auf dem Lab-PC. Nur im Docker-Netz erreichbar (kein Host-Port).
  # Modell nach dem ersten Start laden: docker compose exec ollama ollama pull qwen2.5:7b
  ollama:
    # `:latest` hat keine rekonstruierbare Version — Digest des laufenden Images.
    image: ollama/ollama:latest@sha256:f1a705f2bd113fb8d15f85f7c217f0dc5f6bebda6b0cc42b82c3ad165ffcb9dc
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - automation-net

  # ── n8n ────────────────────────────────────────────────────
  n8n:
    # Eigenes Image: stock n8n plus die PWR-Signaturknoten. Der
    # Erweiterungspfad liegt ausserhalb von /home/node/.n8n, weil das
    # persistente n8n_data-Volume genau darueber gemountet wird.
    build:
      context: ./n8n
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g
    cpus: "1.5"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      # ── Database ──
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-odoo}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY muss gesetzt sein}
      N8N_CALLBACK_SECRET: ${N8N_CALLBACK_SECRET:?N8N_CALLBACK_SECRET muss gesetzt sein}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # ── Routing ──
      # Öffentliche URL via Cloudflare Named Tunnel (HTTPS für Telegram Webhooks)
      WEBHOOK_URL: http://n8n:5678
      N8N_PROXY_HOPS: 1
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      GENERIC_TIMEZONE: Europe/Berlin
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      # ── Security ──
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      N8N_SSRF_PROTECTION_ENABLED: "true"
      N8N_SSRF_ALLOWED_HOSTNAMES: backend
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]'
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Die Freigabe eingebauter Node-Module fuer Code-Nodes ist bewusst
      # ENTFERNT: ein Code-Node, der `require('fs')` darf, liest das
      # Dateisystem des Containers -- einschliesslich der gemounteten Secrets.
      # ── Binary data ──
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_BINARY_DATA_STORAGE_PATH: /home/node/.n8n-files/binaryData
      # ── Execution retention ──
      EXECUTIONS_PROCESS: main
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      # Erfolgslaeufe werden gespeichert: ohne sie gibt es keinen
      # Ausfuehrungsnachweis fuer die Kette -- nur Fehler zu behalten heisst,
      # dass ein funktionierender Durchlauf keine Spur hinterlaesst.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "true"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 3
      # ── Monitoring / Limits ──
      N8N_PAYLOAD_SIZE_MAX: 16
      # ── App-specific ──
      QUALITY_ALERT_EMAIL_FROM: ${QUALITY_ALERT_EMAIL_FROM:-}
      QUALITY_ALERT_EMAIL_TO: ${QUALITY_ALERT_EMAIL_TO:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QUALITY_ALERT_SHADOW_MODEL: ${QUALITY_ALERT_SHADOW_MODEL:-gpt-4o-mini}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/imports:ro
      - ./n8n/tmp:/home/node/.n8n-files
      # provision-n8n-credentials.sh verlangt diesen Mount ausdruecklich.
      - ./n8n/scripts:/home/node/scripts:ro
    networks:
      - automation-net

  # ── Credential-Provisionierung (Einmal-Lauf, nie im normalen Stack) ──
  # Traegt die Secret-Dateien, weil R3s Pruefung sie ablehnt, sobald Docker
  # seinen Default verwendet: root-eigenes 0444. `uid`/`gid`/`mode` sind
  # deshalb explizit und gehoeren zur SERVICE-Referenz, nicht zur
  # Top-Level-Deklaration. Hinter einem Profil, damit ein fehlendes
  # Secret-File den laufenden Stack nicht am Starten hindert -- es trifft
  # genau den, der die Provisionierung ausfuehrt, und das ist richtig so.
  n8n-credentials:
    profiles:
      - provision
    build:
      context: ./n8n
      dockerfile: Dockerfile
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "node /home/node/scripts/provision-credentials.mjs" ]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY muss gesetzt sein}
      PWR_SECRET_DIR: /run/secrets
      # Der Provisioner arbeitet ueber die n8n-CLI. Ohne DIESELBE
      # Datenbankkonfiguration wie der Server faellt die CLI auf ihre lokale
      # SQLite zurueck: die Credentials entstuenden sauber -- nur eben in einem
      # Container, den niemand je wieder anfasst.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-odoo}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Key-IDs kommen aus derselben Quelle wie beim Backend; die Secrets
      # selbst liest das Skript aus /run/secrets.
      PWR_BACKEND_TO_N8N_ACTIVE_KEY_ID: ${PWR_BACKEND_TO_N8N_ACTIVE_KEY_ID:?PWR_BACKEND_TO_N8N_ACTIVE_KEY_ID muss gesetzt sein}
      PWR_N8N_TO_BACKEND_ACTIVE_KEY_ID: ${PWR_N8N_TO_BACKEND_ACTIVE_KEY_ID:?PWR_N8N_TO_BACKEND_ACTIVE_KEY_ID muss gesetzt sein}
    volumes:
      - ./n8n/scripts:/home/node/scripts:ro
    secrets:
      - source: pwr_n8n_native_header
        target: pwr_n8n_native_header
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: pwr_backend_to_n8n_active_hmac
        target: pwr_backend_to_n8n_active_hmac
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: pwr_n8n_to_backend_active_hmac
        target: pwr_n8n_to_backend_active_hmac
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - automation-net

  # ── PWA Static Server ──────────────────────────────────────
  pwa:
    # Bewusst derselbe Pin wie der `caddy`-Dienst.
    image: caddy:2-alpine@sha256:fce4f15aad23222c0ac78a1220adf63bae7b94355d5ea28eee53910624acedfa
    restart: unless-stopped
    volumes:
      - ./pwa:/srv:ro
      - ./infrastructure/caddy/Caddyfile.pwa:/etc/caddy/Caddyfile
    networks:
      - edge-net

# ── OFFEN: `secrets:`-Block (Foundation Task 15 / R3) ─────────────────────
# Der Odoo-19-Cutover hat diesen Block BEWUSST NICHT gesetzt. Grund, gemessen
# und nicht vermutet:
#   * Das Backend liest KEINE Secret-Dateien. backend/app/config.py kennt nur
#     direkte Env-Variablen (PWR_*_SECRET_B64, SESSION_THROTTLE_HMAC_SECRET_B64,
#     N8N_*_SECRET); es gibt weder `read_secret()` noch eine `*_FILE`-Variante,
#     und `extra="ignore"` wuerde `*_FILE`-Variablen still verschlucken. Die
#     direkten Variablen durch Datei-Varianten zu ersetzen — wie der Cutover-Plan
#     Task 5 Step 4 vorsah — haette das Backend startunfaehig gemacht.
#   * Nur infrastructure/scripts/provision-n8n-credentials.sh liest /run/secrets
#     (pwr_n8n_native_header, pwr_backend_to_n8n_active_hmac,
#     pwr_n8n_to_backend_active_hmac; optional pwr_backend_to_n8n_previous_hmac,
#     pwr_n8n_callback_legacy). Das ist ein manuelles Skript, kein
#     Container-Start — der laufende Stack ist davon nicht betroffen.
# Wer den Block nachruestet, MUSS `uid`, `gid` und `mode` explizit setzen
# (Docker-Default ist root-eigenes 0444, was die Pruefung beider Haelften
# ablehnt), und muss zusaetzlich ./n8n/scripts nach
# /home/node/scripts read-only in den n8n-Container mounten — das verlangt
# provision-n8n-credentials.sh ausdruecklich und heute fehlt der Mount.
volumes:
  pg_data:
  odoo_data:
  odoo_lager2_data:
  # Der odoo19-trial-Dienst ist mit dem Cutover entfallen. Diese Deklaration
  # bleibt waehrend des Rollback-Fensters bestehen, damit der Papierpfad
  # erhalten bleibt; sie wird im Folge-Commit nach Schliessen des Fensters
  # entfernt (Plan Task 8, "Closing the window").
  # ACHTUNG: explizites globales `name:` — dieses Volume ist NICHT
  # projekt-gescoped und darf nicht fuer Produktion wiederverwendet werden.
  odoo19_trial_data:
    name: odoo19_trial_data
  caddy_data:
  caddy_config:
  n8n_data:
  ollama_data:
  whisper_cache:


secrets:
  # Die Dateien liegen unter infrastructure/secrets/ und sind gitignored. Sie
  # existieren auf einer frischen Maschine NICHT -- deshalb haengen sie am
  # Profil-Dienst `n8n-credentials` und nicht am laufenden Stack.
  pwr_n8n_native_header:
    file: ./infrastructure/secrets/pwr_n8n_native_header
  pwr_backend_to_n8n_active_hmac:
    file: ./infrastructure/secrets/pwr_backend_to_n8n_active_hmac
  pwr_n8n_to_backend_active_hmac:
    file: ./infrastructure/secrets/pwr_n8n_to_backend_active_hmac


networks:
  # Drei Netze statt einem. `internal: true` heisst: kein Weg nach draussen.
  # Nur `edge-net` ist es nicht, und dort haengen genau die drei Dienste, die
  # eine Anfrage von aussen sehen duerfen.
  edge-net:
    driver: bridge
    ipam:
      config:
        # `ip_range` haelt die unteren Adressen frei. Ohne das vergibt Docker
        # 172.28.10.2 dynamisch an den erstbesten Dienst -- gemessen: `pwa`
        # bekam sie und `caddy` startete danach mit "Address already in use".
        # Die festen Adressen existieren, damit TRUSTED_CADDY_PEERS eine
        # Adresse nennen kann, die sich nicht bei jedem `up` aendert.
        - subnet: 172.28.10.0/24
          ip_range: 172.28.10.128/25
  core-net:
    driver: bridge
    internal: true
  automation-net:
    driver: bridge
    internal: true
