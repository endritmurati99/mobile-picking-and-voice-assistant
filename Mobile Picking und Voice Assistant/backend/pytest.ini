[pytest]
markers =
    odoo19_live: requires a real Odoo 19 process with two independent RPC connections
    foundation_live: requires the real Odoo 19, FastAPI, n8n, and PostgreSQL stack

# The live gates are opt-in, and they are excluded BY PATH rather than by a
# default `-m "not odoo19_live"`. A marker expression would silently deselect
# them, so a live suite that no longer collects at all would still read as a
# green ordinary run -- and these tests exist precisely because they cannot pass
# against mocks. Running them is a deliberate act: `pytest tests/live`.
norecursedirs = tests/live .deps
