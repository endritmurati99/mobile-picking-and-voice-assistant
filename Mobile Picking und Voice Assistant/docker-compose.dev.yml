# Development overlay (Foundation Task 15).
#
# The production file publishes ONE thing: Caddy. Everything a developer needs
# to poke at directly is published here instead, and every binding is pinned to
# 127.0.0.1 -- a bare "8069:8069" is reachable from the whole LAN, which is
# exactly the surface the production file removes.
#
# Use it explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# or set it once for this machine in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#
# The backend loopback exists so signed internal-route fixtures can bypass the
# edge deny-list; production publishes no backend port at all.
# `core-net` and `automation-net` are `internal: true`. A container that hangs
# ONLY there cannot be reached through a published port: Docker accepts the
# mapping, but the packet is never routed and `curl 127.0.0.1:8069` just hangs
# (gemessen 2026-08-04 -- backend war erreichbar, odoo/n8n/db nicht, weil nur
# backend ohnehin an `edge-net` haengt). Deshalb haengt dieses Overlay jeden
# publizierten Dienst zusaetzlich an `edge-net`. Nur Dev -- die Produktionsdatei
# laesst sie auf den internen Netzen.
services:
  backend:
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

  db:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - core-net
      - automation-net
      - edge-net

  odoo:
    ports:
      - "127.0.0.1:${ODOO_HOST_PORT:-8069}:8069"
    networks:
      - core-net
      - edge-net

  odoo-lager-2:
    ports:
      - "127.0.0.1:${ODOO_LAGER2_HOST_PORT:-8070}:8069"
    networks:
      - core-net
      - edge-net

  n8n:
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    networks:
      - automation-net
      - edge-net
